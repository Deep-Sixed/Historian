[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "historian"
version = "0.1.0a2"
description = "Provenance-first evidence qualification and question-bound adjudication"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
historian = "historian.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["historian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sqlite: Linux peer-credential SQLite deployment tests; requires disposable container",
    "structural_gate: G-S1..G-S9 structural invariant enforcement",
]
