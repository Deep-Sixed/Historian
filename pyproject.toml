[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "historian"
version = "0.1.0"
description = "Evidence adjudication layer for redacted: typed relations, provenance, structural abstention"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "psycopg[binary]>=3"]

[tool.hatch.build.targets.wheel]
packages = ["historian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "structural_gate: G-S1..G-S9 structural invariant enforcement",
    "pg: PostgreSQL security/invariant tests; requires --run-pg and a provisioned database",
    "canary: real-corpus regression signal - NON-BLOCKING, not a release gate",
]
