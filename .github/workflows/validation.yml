name: Historian validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Python/core tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14.5"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint Persistence v1 additions
        run: |
          python -m pip install ruff
          ruff check --isolated --select E4,E7,E9,F historian/persistence tests/persistence_pg.py tests/test_persistence_contract.py tests/test_persistence_pg.py historian/libsql_store tests/libsql_probe.py tests/libsql_process.py tests/test_libsql_profile.py tests/test_libsql_storage.py
      - name: Run core/static gate
        run: python -m pytest -q -m "not pg and not canary"

  postgres:
    name: PostgreSQL security/invariant tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: evecor_historian
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evecor_historian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5444"
      PGDATABASE: evecor_historian
      PGUSER: postgres
      PGPASSWORD: postgres
      HISTORIAN_CONFORMANCE_REPORT: /tmp/historian-persistence-conformance.json
      HISTORIAN_PGHOST: 127.0.0.1
      HISTORIAN_PGPORT: "5444"
      HISTORIAN_PGDATABASE: evecor_historian
      HISTORIAN_CORPUS: /tmp/historian-synthetic-corpus
      HISTORIAN_TEST_DOC: 2026-07-08-decommissioning-hindsight-memory
      HISTORIAN_OWNER: historian_owner_ci
      HISTORIAN_EXTRACTOR: historian_extractor_ci
      HISTORIAN_EVIDENCE_VERIFIER: historian_evidence_verifier_ci
      HISTORIAN_CASE_DESIGNER: historian_case_designer_ci
      HISTORIAN_TYPED_INGESTOR: historian_typed_ingestor_ci
      HISTORIAN_HUMAN_REVIEWER: historian_human_reviewer_ci
      HISTORIAN_RUNTIME: historian_runtime_ci
      HISTORIAN_PACKET_BUILDER: historian_packet_builder_ci
      HISTORIAN_GOLD_COMPILER: historian_gold_compiler_ci
      HISTORIAN_ADJ_ALICE: historian_adj_alice_ci
      HISTORIAN_ADJ_BOB: historian_adj_bob_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build frozen baseline database and apply migration
        run: scripts/ci-setup-postgres.sh
      - name: Create synthetic verifier corpus
        run: scripts/ci-create-synthetic-corpus.sh
      - name: Run PostgreSQL gate
        run: python -m pytest -q -m pg --run-pg

      - name: Publish exact profile result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["HISTORIAN_CONFORMANCE_REPORT"])
          if report.exists():
              data = json.loads(report.read_text())
              result = (f"{data['profile_name']} version {data['profile_version']} "
                        f"digest {data['profile_digest']}: {data['status']}")
          else:
              result = "postgresql-role-isolated-v1 version 1: NOT_TESTED (report unavailable)"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(result + "\n")
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-v1-postgresql-evidence
          path: /tmp/historian-persistence-conformance.json
          if-no-files-found: warn

  libsql:
    name: libSQL Linux peer-credential profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test isolated libSQL profile
        run: scripts/ci-libsql-profile.sh
      - name: Publish exact libSQL profile result
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path('/tmp/historian-libsql-artifacts/historian-libsql-conformance.json')
          if path.exists():
              report = json.loads(path.read_text())
              message = (f"{report['profile_name']} v{report['profile_version']} "
                         f"digest {report['profile_digest']}: {report['status']}")
          else:
              message = 'libsql-linux-peercred-service-v1 v1: NOT_TESTED (report unavailable)'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-v1-libsql-evidence
          path: /tmp/historian-libsql-artifacts/*.json
          if-no-files-found: warn

  corpus-canary:
    name: Corpus canary
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run corpus canary when corpus is available
        run: |
          corpus="/mnt/jarvis-data/projects/chatgpt-export/corpus"
          if [ ! -d "$corpus" ]; then
            echo "Corpus canary: NOT RUN - real Historian corpus is not available on this runner" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if python -m pytest -q -m canary --run-corpus; then
            echo "Corpus canary: PASS" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Corpus canary: FAIL" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
