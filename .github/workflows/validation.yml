name: Historian validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  public-release:
    name: Public source privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"
      - name: Scan supported source tree
        run: python scripts/public_release_guard.py > "$RUNNER_TEMP/public-source-scan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-source-scan
          path: ${{ runner.temp }}/public-source-scan.json
          if-no-files-found: error

  core:
    name: Python/core tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14.5"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint Persistence v1 additions
        run: |
          python -m pip install ruff
          ruff check --isolated --select E4,E7,E9,F historian/persistence tests/test_persistence_contract.py historian/sqlite_store tests/sqlite_probe.py tests/sqlite_process.py tests/test_sqlite_profile.py tests/test_sqlite_storage.py tests/test_sqlite_application.py
      - name: Run core/static gate
        run: python -m pytest -q

  sqlite:
    name: SQLite Linux peer-credential profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test isolated SQLite profile
        run: scripts/ci-sqlite-profile.sh
      - name: Publish exact SQLite profile result
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path('/tmp/historian-sqlite-artifacts/historian-sqlite-conformance.json')
          if path.exists():
              report = json.loads(path.read_text())
              message = (f"{report['profile_name']} v{report['profile_version']} "
                         f"digest {report['profile_digest']}: {report['status']}")
          else:
              message = 'sqlite-linux-peercred-service-v1 v1: NOT_TESTED (report unavailable)'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-v1-sqlite-evidence
          path: /tmp/historian-sqlite-artifacts/*.json
          if-no-files-found: warn

  package:
    name: Installed wheel and restore smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"
      - run: python -m pip install build
      - run: scripts/ci-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: historian-distributions
          path: dist/*
