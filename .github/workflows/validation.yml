name: Historian validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Python/core tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14.5"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint Persistence v1 additions
        run: |
          python -m pip install ruff
          ruff check --isolated --select E4,E7,E9,F historian/persistence tests/test_persistence_contract.py historian/libsql_store tests/libsql_probe.py tests/libsql_process.py tests/test_libsql_profile.py tests/test_libsql_storage.py tests/test_libsql_application.py
      - name: Run core/static gate
        run: python -m pytest -q -m "not canary"

  libsql:
    name: libSQL Linux peer-credential profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test isolated libSQL profile
        run: scripts/ci-libsql-profile.sh
      - name: Publish exact libSQL profile result
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path('/tmp/historian-libsql-artifacts/historian-libsql-conformance.json')
          if path.exists():
              report = json.loads(path.read_text())
              message = (f"{report['profile_name']} v{report['profile_version']} "
                         f"digest {report['profile_digest']}: {report['status']}")
          else:
              message = 'libsql-linux-peercred-service-v1 v3: NOT_TESTED (report unavailable)'
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-v1-libsql-evidence
          path: /tmp/historian-libsql-artifacts/*.json
          if-no-files-found: warn

  corpus-canary:
    name: Corpus canary
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run corpus canary when corpus is available
        run: |
          corpus="/mnt/jarvis-data/projects/chatgpt-export/corpus"
          if [ ! -d "$corpus" ]; then
            echo "Corpus canary: NOT RUN - real Historian corpus is not available on this runner" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if python -m pytest -q -m canary --run-corpus; then
            echo "Corpus canary: PASS" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Corpus canary: FAIL" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  package:
    name: Installed wheel and restore smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"
      - run: python -m pip install build
      - run: scripts/ci-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: historian-distributions
          path: dist/*
